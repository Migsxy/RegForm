<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="regform.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="form-card">
        <section class="form-intro">
          <p class="eyebrow">Create your account</p>
          <h1>Registration Form</h1>
          <p>Join our community with a quick and easy sign-up process.</p>
        </section>

        <section id="form" class="form-panel">
          <form>
            
            <div class="form-row">
              <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="fname" name="firstname" required />
              </div>
              <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" id="lname" name="lastname" required />
              </div>
            </div>

            <div class="form-group">
                  <label for="gender">Gender</label>
                  <select id="gender" name="gender" required>
                    <option value="">Select your gender</option> 
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" required />
                <p id="password-error" class="error-message" aria-live="polite"></p>
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="passwordconfirm" minlength="8" required />
              </div>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" title="Please enter your phone number" required />
            </div>

            <div class="form-group">
              <label for="start_date">Birth Date</label>
              <input type="date" class="form-control" id="start_date" name="start_date" value="{{ old('start_date') }}" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="address">Home Address</label>
              <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="region">Region</label>
                <select id="region" name="region" required>
                  <option value="">Select a region</option>
                  <option value="ncr">NCR</option>
                  <option value="car">CAR</option>
                  <option value="region1">Region I</option>
                  <option value="region2">Region II</option>
                  <option value="region3">Region III</option>
                  <option value="iv-a">IV-A CALABARZON</option>
                  <option value="iv-b">IV-B MIMAROPA</option>
                  <option value="v">Region V</option>
                  <option value="vi">Region VI</option>
                  <option value="vii">Region VII</option>
                  <option value="viii">Region VIII</option>
                  <option value="nir">NIR</option>
                  <option value="ix">Region IX</option>
                  <option value="x">Region X</option>
                  <option value="xi">Region XI</option>
                  <option value="xii">Region XII</option>
                  <option value="xiii">Region XIII</option>
                  <option value="barmm">BARMM</option>
                </select>
              </div>
              <div class="form-group">
                <label for="Province">Province</label>
                <input type="text" id="Province" name="Province" required />
              </div>
                <div class="form-group">
                  <label for="municipality">Municipality</label>
                  <input type="text" id="municipality" name="municipality" required />
              </div>
              <div class="form-group">
                <label for="barangay">Barangay</label>
                <input type="text" id="barangay" name="barangay" required />
                </div>
            </div>

            <div class="form-zip">
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" name="zip" required />
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="scales" name="scales" required />
              <label for="scales">I agree with the <a href="termscondition.html">Terms and Conditions</a></label>
            </div>

            <button type="submit">Submit</button>
          </form>
        </section>
      </div>
    </main>

    <script src="form-validation.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const errorElement = document.getElementById('password-error');

        if (form && passwordInput && confirmInput && errorElement) {
          initializePasswordConfirmation(form, passwordInput, confirmInput, errorElement);
        }

        if (form) {
          initializeNameAndZipValidation(form);
        }
      });
    </script>
  </body>
</html>
